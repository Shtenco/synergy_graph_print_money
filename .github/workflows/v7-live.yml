name: V7 live Base snapshot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-snapshot-quote-fork:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      BASE_RPC_URL: https://base-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python engine
        run: pip install -e . pytest
      - name: Unit and conservation gates
        run: pytest -q
      - name: Live Base hybrid discovery and quoteable frontier at one pinned block
        run: >-
          python scripts/run_v7_hybrid.py
          --pages 12
          --max-pools 240
          --max-hops 5
          --top-candidates 500
          --max-expansions 300000
          --factory-scan 3000
          --rpc-probe-pools 30
          --vault-token-checks 20
          --sleep 8
          --max-retries 10
          --rpc-url "$BASE_RPC_URL"
          --out artifacts
      - name: V7.2 huge-graph QE edge-field preflight
        run: >-
          python scripts/run_v7_2_global_preflight.py
          --pools artifacts/v7_pools.csv
          --out artifacts/v7_2_global_preflight.json
          --own-tvl-usd-per-pool 10000
          --rubc-reference-usd 1
          --own-fee-bps 30
          --foreign-fee-fallback-bps 30
          --pulse-grid 0,0.005,0.01,0.02,0.05
      - name: V7.4 recover and exact-quote Uniswap V4 PoolIds
        shell: bash
        run: |
          BLOCK=$(python -c "import json; print(json.load(open('artifacts/v7_report.json'))['block_number'])")
          python scripts/run_v7_4_v4_exact.py \
            --pools artifacts/v7_pools.csv \
            --block "$BLOCK" \
            --rpc-url "$BASE_RPC_URL" \
            --quote-usd 100 \
            --out artifacts
      - name: V7.1 exact adapters for foreign legs of the global packet frontier
        shell: bash
        run: |
          BLOCK=$(python -c "import json; print(json.load(open('artifacts/v7_report.json'))['block_number'])")
          python scripts/run_v7_exact_v2.py \
            --pools artifacts/v7_pools.csv \
            --candidates artifacts/v7_candidates_quoteable.csv \
            --block "$BLOCK" \
            --max-candidates 200 \
            --max-flash-usd 50000 \
            --mev-haircut 0.35 \
            --min-net-usd 0.01 \
            --out artifacts
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Pinned Base fork execution gate
        shell: bash
        run: |
          if grep -q "contract V7GeneratedForkTest" artifacts/V7GeneratedFork.t.sol; then
            cp artifacts/V7GeneratedFork.t.sol test/V7GeneratedFork.t.sol
            set +e
            forge test --match-contract V7GeneratedForkTest -vvv
            RC=$?
            set -e
            python -c "import json,sys; rc=int(sys.argv[1]); json.dump({'fork_candidate_generated': True, 'fork_executable': rc == 0, 'forge_exit_code': rc}, open('artifacts/v7_fork_result.json','w'), indent=2)" "$RC"
            exit "$RC"
          else
            echo '{"fork_candidate_generated": false, "fork_executable": false, "reason": "no positive forkable quote candidate at pinned block"}' > artifacts/v7_fork_result.json
          fi
      - name: Upload complete V7 evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sag-v7-live-evidence
          path: artifacts/
