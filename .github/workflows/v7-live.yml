name: V7 live Base snapshot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q
      - name: Live Base discovery + pinned RPC probes
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: python scripts/run_v7.py --pages 10 --max-pools 240 --augment-dexes 5 --augment-pages 2 --max-hops 4 --rpc-probe-pools 60 --vault-token-checks 20 --sleep 15 --out artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sag-v7-live-snapshot
          path: artifacts/
          if-no-files-found: warn
