name: V7 live Base snapshot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: v7-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q
      - name: Live Base discovery + pinned RPC probes
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: python scripts/run_v7.py --pages 10 --max-pools 240 --augment-dexes 5 --augment-pages 2 --max-hops 4 --rpc-probe-pools 60 --vault-token-checks 20 --sleep 15 --out artifacts
      - name: Exact Aerodrome V2 eth_call quote verification
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: python scripts/quote_v7.py --artifacts artifacts --max-candidates 20 --max-flash-usd 50000 --mev-guard-bps 5 --gas-reserve-usd 0.05
      - name: Render pinned candidate fork test
        run: python scripts/render_fork_test.py --artifacts artifacts --out test/generated/V7Candidate.t.sol
      - uses: foundry-rs/foundry-toolchain@v1
        if: ${{ hashFiles('test/generated/V7Candidate.t.sol') != '' }}
      - name: Execute real Balancer flash loan on Base fork
        if: ${{ hashFiles('test/generated/V7Candidate.t.sol') != '' }}
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: |
          set +e
          forge test --match-contract V7GeneratedForkTest -vvv > artifacts/v7_fork.log 2>&1
          code=$?
          python - "$code" <<'PY'
          import json,sys
          from pathlib import Path
          code=int(sys.argv[1]);Path('artifacts/v7_fork_result.json').write_text(json.dumps({'attempted':True,'fork_executable':code==0,'forge_exit_code':code},indent=2))
          PY
          cat artifacts/v7_fork.log
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sag-v7-live-snapshot
          path: artifacts/
          if-no-files-found: warn
