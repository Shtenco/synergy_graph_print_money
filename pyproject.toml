[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"

[project]
name="synergy-graph-print-money"
version="0.7.2"
description="SAG V7 live Base liquidity multigraph research engine"
requires-python=">=3.11"
dependencies=[
  "requests>=2.32,<3",
  "eth-abi>=5.1,<6",
  "eth-utils>=5,<6",
  "eth-hash[pycryptodome]>=0.7,<1",
]

[tool.setuptools.packages.find]
where=["src"]
